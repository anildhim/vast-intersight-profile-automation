---
- name: Configure Cisco Intersight server profiles
  hosts: localhost
  gather_facts: false
  pre_tasks:
    - name: Load local Intersight overrides if present
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../.intersight.local.yml"
      ignore_errors: true
  vars_files:
    - ../group_vars/all.yml

  roles:
    - role: intersight_organization
    - role: intersight_server_profiles
