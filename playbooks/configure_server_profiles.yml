---
- name: Configure Cisco Intersight server profiles
  hosts: localhost
  gather_facts: false
  pre_tasks:
    - name: Load local Intersight overrides if present
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../.intersight.local.yml"
      ignore_errors: true


    - name: Force derive-only mode
      ansible.builtin.set_fact:
        intersight_server_profile_assign_enabled: false
        intersight_server_profile_assignments: []
        intersight_server_profile_deployments: []
  vars_files:
    - ../group_vars/all.yml

  roles:
    - role: intersight_organization
    - role: intersight_server_profiles
