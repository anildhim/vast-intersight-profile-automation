---
- name: Build Cisco Intersight software repository operating system files
  hosts: localhost
  gather_facts: false
  pre_tasks:
    - name: Load local Intersight overrides if present
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../.intersight.local.yml"
      ignore_errors: true

  vars_files:
    - ../group_vars/all.yml

  roles:
    - role: intersight_organization
    - role: intersight_software_repository
