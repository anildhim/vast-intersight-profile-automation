---
- name: Test Cisco Intersight organization creation
  hosts: localhost
  gather_facts: false
  pre_tasks:
    - name: Load local Intersight overrides if present
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../.intersight.local.yml"
      ignore_errors: true
    - name: Force live changes for targeted organization test
      ansible.builtin.set_fact:
        intersight_apply_changes: true
  vars_files:
    - ../group_vars/all.yml

  roles:
    - role: intersight_organization
