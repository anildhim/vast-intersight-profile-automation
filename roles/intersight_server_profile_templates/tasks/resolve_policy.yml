---
- name: Normalize policy reference for {{ template_item.name }} -> {{ policy_item.key }}
  ansible.builtin.set_fact:
    intersight_template_policy_name: >-
      {{
        policy_item.value.name
        if policy_item.value is mapping
        else policy_item.value
      }}
    intersight_template_policy_org_name: >-
      {{
        policy_item.value.organization
        if policy_item.value is mapping and policy_item.value.organization is defined
        else template_item.organization | default(intersight_organization)
      }}

- name: Use target organization MOID for {{ template_item.name }} -> {{ policy_item.key }}
  ansible.builtin.set_fact:
    intersight_template_policy_org_moid: "{{ template_org_moid }}"
  when: intersight_template_policy_org_name == (template_item.organization | default(intersight_organization))

- name: Look up source organization MOID for {{ template_item.name }} -> {{ policy_item.key }}
  cisco.intersight.intersight_rest_api:
    api_private_key: "{{ intersight_api_private_key_path }}"
    api_key_id: "{{ intersight_api_key_id }}"
    api_uri: "{{ intersight_api_endpoint }}/api/v1"
    validate_certs: "{{ intersight_validate_certs }}"
    resource_path: "/organization/Organizations"
    query_params:
      $filter: "Name eq '{{ intersight_template_policy_org_name }}'"
  register: intersight_template_policy_org_lookup
  when: intersight_template_policy_org_name != (template_item.organization | default(intersight_organization))

- name: Capture source organization MOID for {{ template_item.name }} -> {{ policy_item.key }}
  ansible.builtin.set_fact:
    intersight_template_policy_org_moid: "{{ intersight_template_policy_org_lookup.api_response.Moid }}"
  when: intersight_template_policy_org_name != (template_item.organization | default(intersight_organization))

- name: Resolve policy object for {{ template_item.name }} -> {{ policy_item.key }}
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/intersight_lookup_resource.py"
      - --api-uri
      - "{{ intersight_api_endpoint }}/api/v1"
      - --resource-path
      - "{{ intersight_policy_lookup_map[policy_item.key].resource_path }}"
      - --api-key-id
      - "{{ intersight_api_key_id }}"
      - --api-private-key
      - "{{ intersight_api_private_key_path }}"
      - --name
      - "{{ intersight_template_policy_name }}"
      - --organization-moid
      - "{{ intersight_template_policy_org_moid }}"
  register: intersight_template_policy_lookup
  changed_when: false

- name: Append policy bucket entry for {{ template_item.name }} -> {{ policy_item.key }}
  ansible.builtin.set_fact:
    intersight_current_policy_bucket: >-
      {{
        (intersight_current_policy_bucket | default([]))
        + [{
          'Moid': (intersight_template_policy_lookup.stdout | from_json).Moid,
          'ObjectType': (intersight_template_policy_lookup.stdout | from_json).ObjectType
        }]
      }}
