- name: Placeholder for unsupported policy creation tasks
  ansible.builtin.debug:
    msg: >-
      Create or update the {{ item.key }} policies here after we capture the
      detailed policy settings from Intersight.
  loop: "{{ intersight_policy_catalog | dict2items | rejectattr('key', 'in', ['bios', 'boot_order', 'power', 'local_user', 'ipmi_over_lan', 'serial_over_lan', 'virtual_kvm', 'storage', 'thermal', 'ntp']) | list }}"
  loop_control:
    label: "{{ item.key }}"
