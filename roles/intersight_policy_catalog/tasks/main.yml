---
- name: Validate required Intersight API settings for policy build
  ansible.builtin.assert:
    that:
      - intersight_api_key_id | length > 0
      - intersight_api_private_key_path | length > 0
      - intersight_api_endpoint | length > 0
      - intersight_organization | length > 0
      - intersight_policy_catalog is mapping
    fail_msg: >-
      Missing required Intersight configuration for policy creation. Export
      INTERSIGHT_API_KEY_ID and INTERSIGHT_API_PRIVATE_KEY_PATH, then review
      group_vars/all.yml.

- name: Validate required policy groups exist in the catalog
  ansible.builtin.assert:
    that:
      - intersight_policy_catalog[item] is defined
      - intersight_policy_catalog[item] | length > 0
    fail_msg: "Missing policy catalog definition for {{ item }}."
  loop: "{{ intersight_policy_types_required }}"

- name: Show policy catalog plan
  ansible.builtin.debug:
    msg:
      - "Organization: {{ intersight_organization }}"
      - "Target platform: {{ intersight_target_platform }}"
      - "Target server model: {{ intersight_target_server_model }}"
      - "Policy type: {{ item.key }}"
      - "Defined policies: {{ item.value | map(attribute='name') | list }}"
  loop: "{{ intersight_policy_catalog | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Stop before live changes unless explicitly enabled
  ansible.builtin.assert:
    that:
      - intersight_apply_changes | bool
    fail_msg: >-
      Live Intersight changes are disabled. Set intersight_apply_changes: true
      in .intersight.local.yml only when you want to modify your account.

- name: Use provided organization MOID for policy creation
  ansible.builtin.set_fact:
    intersight_policy_catalog_org:
      api_response:
        Moid: "{{ intersight_organization_moid }}"
  when: intersight_organization_moid | length > 0

- name: Get organization MOID for policy creation
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/intersight_lookup_resource.py"
      - --api-uri
      - "{{ intersight_api_endpoint }}/api/v1"
      - --resource-path
      - /organization/Organizations
      - --api-key-id
      - "{{ intersight_api_key_id }}"
      - --api-private-key
      - "{{ intersight_api_private_key_path }}"
      - --name
      - "{{ intersight_organization }}"
  register: intersight_policy_catalog_org_lookup
  changed_when: false
  when: intersight_organization_moid | length == 0

- name: Capture organization MOID for policy creation
  ansible.builtin.set_fact:
    intersight_policy_catalog_org:
      api_response:
        Moid: "{{ (intersight_policy_catalog_org_lookup.stdout | from_json).Moid }}"
  when:
    - intersight_organization_moid | length == 0
    - intersight_policy_catalog_org_lookup.stdout is defined
    - intersight_policy_catalog_org_lookup.stdout | length > 0

- name: Create or update BIOS policies
  ansible.builtin.include_tasks: bios.yml
  loop: "{{ intersight_policy_catalog.bios | default([]) }}"
  loop_control:
    loop_var: bios_policy_item
    label: "{{ bios_policy_item.name }}"

- name: Create or update boot order policies
  ansible.builtin.include_tasks: boot_order.yml
  loop: "{{ intersight_policy_catalog.boot_order | default([]) }}"
