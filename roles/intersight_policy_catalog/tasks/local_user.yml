---
- name: Validate local user policy inputs for {{ local_user_policy_item.name }}
  ansible.builtin.assert:
    that:
      - local_user_policy_item.name | length > 0
      - local_user_policy_item.users | length > 0
      - local_user_policy_item.users[0].username | length > 0
      - local_user_policy_item.admin_role_moid | length > 0
    fail_msg: "Local user policy {{ local_user_policy_item.name }} is missing required settings."

- name: Use target organization MOID for {{ local_user_policy_item.name }}
  ansible.builtin.set_fact:
    intersight_local_user_policy_org_moid: "{{ intersight_organization_moid if intersight_organization_moid | length > 0 else intersight_policy_catalog_org.api_response.Moid }}"
  when: (local_user_policy_item.organization | default(intersight_organization)) == intersight_organization

- name: Look up local user policy source organization for {{ local_user_policy_item.name }}
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/intersight_lookup_resource.py"
      - --api-uri
      - "{{ intersight_api_endpoint }}/api/v1"
      - --resource-path
      - /organization/Organizations
      - --api-key-id
      - "{{ intersight_api_key_id }}"
      - --api-private-key
      - "{{ intersight_api_private_key_path }}"
      - --name
      - "{{ local_user_policy_item.organization }}"
  register: intersight_local_user_policy_org_lookup
  changed_when: false
  when: (local_user_policy_item.organization | default(intersight_organization)) != intersight_organization

- name: Use source organization MOID for {{ local_user_policy_item.name }}
  ansible.builtin.set_fact:
    intersight_local_user_policy_org_moid: "{{ (intersight_local_user_policy_org_lookup.stdout | from_json).Moid }}"
  when: (local_user_policy_item.organization | default(intersight_organization)) != intersight_organization

- name: Build local user policy payload for {{ local_user_policy_item.name }}
  ansible.builtin.set_fact:
    intersight_local_user_policy_payload:
      Name: "{{ local_user_policy_item.name }}"
      Description: "{{ local_user_policy_item.description | default(omit) }}"
      Organization:
        Moid: "{{ intersight_local_user_policy_org_moid }}"
      PasswordProperties:
        ClassId: "iam.EndPointPasswordProperties"
        ObjectType: "iam.EndPointPasswordProperties"
        EnablePasswordExpiry: "{{ local_user_policy_item.enable_password_expiry | default(false) }}"
        EnforceStrongPassword: "{{ local_user_policy_item.enforce_strong_password | default(true) }}"
        ForceSendPassword: false
        GracePeriod: 0
        NotificationPeriod: 15
        PasswordExpiryDuration: 90
        PasswordHistory: "{{ local_user_policy_item.password_history | default(5) }}"

- name: Create temp payload file for {{ local_user_policy_item.name }}
  ansible.builtin.tempfile:
    state: file
    suffix: ".json"
  register: intersight_local_user_payload_file

- name: Write payload for {{ local_user_policy_item.name }}
  ansible.builtin.copy:
    dest: "{{ intersight_local_user_payload_file.path }}"
    content: "{{ intersight_local_user_policy_payload | to_nice_json }}"
    mode: "0600"

- name: Create or update local user policy {{ local_user_policy_item.name }}
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/intersight_local_user_upsert.py"
      - --api-uri
      - "{{ intersight_api_endpoint }}/api/v1"
      - --api-key-id
      - "{{ intersight_api_key_id }}"
      - --api-private-key
      - "{{ intersight_api_private_key_path }}"
      - --policy-file
      - "{{ intersight_local_user_payload_file.path }}"
      - --policy-organization-moid
      - "{{ intersight_local_user_policy_org_moid }}"
      - --username
      - "{{ local_user_policy_item.users[0].username }}"
      - --role-moid
      - "{{ local_user_policy_item.admin_role_moid }}"
      - --password
      - "{{ local_user_policy_item.users[0].password }}"
  register: intersight_local_user_policy_result
  changed_when: true

- name: Remove temp payload file for {{ local_user_policy_item.name }}
  ansible.builtin.file:
    path: "{{ intersight_local_user_payload_file.path }}"
    state: absent

- name: Summarize local user policy {{ local_user_policy_item.name }}
  ansible.builtin.debug:
    var: intersight_local_user_policy_result
