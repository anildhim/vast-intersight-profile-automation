---
- name: Resolve organization MOID for {{ server_profile_item.template_name }}
  cisco.intersight.intersight_rest_api:
    api_private_key: "{{ intersight_api_private_key_path }}"
    api_key_id: "{{ intersight_api_key_id }}"
    api_uri: "{{ intersight_api_endpoint }}/api/v1"
    validate_certs: "{{ intersight_validate_certs }}"
    resource_path: "/organization/Organizations"
    query_params:
      $filter: "Name eq '{{ server_profile_item.organization | default(intersight_organization) }}'"
  register: intersight_server_profile_org_lookup

- name: Resolve template for {{ server_profile_item.template_name }}
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/intersight_lookup_resource.py"
      - --api-uri
      - "{{ intersight_api_endpoint }}/api/v1"
      - --resource-path
      - /server/ProfileTemplates
      - --api-key-id
      - "{{ intersight_api_key_id }}"
      - --api-private-key
      - "{{ intersight_api_private_key_path }}"
      - --name
      - "{{ server_profile_item.template_name }}"
      - --organization-moid
      - "{{ intersight_server_profile_org_lookup.api_response.Moid }}"
  register: intersight_server_profile_template_lookup
  changed_when: false

- name: Derive server profiles from {{ server_profile_item.template_name }}
  vars:
    intersight_derive_profile_argv: >-
      {{
        [
          'python3',
          playbook_dir ~ '/../scripts/intersight_derive_server_profile.py',
          '--api-uri',
          intersight_api_endpoint ~ '/api/v1',
          '--api-key-id',
          intersight_api_key_id,
          '--api-private-key',
          intersight_api_private_key_path,
          '--template-moid',
          (intersight_server_profile_template_lookup.stdout | from_json).Moid,
          '--base-name',
          (server_profile_item.base_name | default(server_profile_item.template_name)),
          '--count',
          ((server_profile_item.number_of_profiles | default(intersight_number_of_profiles | default(server_profile_item.count | default(1)))) | string),
          '--start-index',
          ((server_profile_item.start_index | default(1)) | string),
          '--organization-moid',
          intersight_server_profile_org_lookup.api_response.Moid,
          '--description',
          (server_profile_item.description | default('')),
          '--tags-json',
          (server_profile_item.tags | default([]) | to_json),
        ]
        +
        (['--auto-start-index'] if (server_profile_item.auto_start_index | default(false) | bool) else [])
      }}
  ansible.builtin.command:
    argv: "{{ intersight_derive_profile_argv }}"
  register: intersight_derived_server_profile_result
  changed_when: >-
    intersight_derived_server_profile_result.stdout | default('') | length > 0 and
    ((intersight_derived_server_profile_result.stdout | from_json).changed | default(false))

- name: Summarize derived profiles from {{ server_profile_item.template_name }}
  ansible.builtin.debug:
    var: intersight_derived_server_profile_result
